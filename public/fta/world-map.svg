    <!-- SE Asia / islands -->
    <path d="M720 230 L780 220 L800 260 L760 280 L720 260 Z"/>
    <!-- Australia -->
    <path d="M760 320 L850 310 L880 350 L850 390 L780 380 Z"/>
    <!-- NZ -->
