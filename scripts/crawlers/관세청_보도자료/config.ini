[crawler]
# Windows defaults required by the specification.
db_path = D:\SQLiteDB\smart_law_ai.db
download_dir = C:\SQLiteDB\downloads
start_page = 1
end_page = 1
# Seconds between HTTP requests. Do not set this to a negative number.
delay_seconds = 0.5
connect_timeout_seconds = 15
read_timeout_seconds = 60
retries = 3
