# ==============================================================================
# 관세청 행정규칙 행정예고 크롤러 설정 파일 (v3.1)
# ==============================================================================

[database]
# SQLite 데이터베이스 파일 경로
db_path = D:\SQLiteDB\smart_law_ai.db

[download]
# 첨부파일 저장 경로 (기본: C:\SQLiteDB\downloads\ 하위 관세청\행정규칙예고 폴더)
download_dir = C:\SQLiteDB\downloads\관세청\행정규칙예고

# 첨부파일 파일명 저장 방식:
#   seq_prefix : 1451_원본파일명.hwpx (기본 권장, 파일명 충돌 방지)
#   subfolder  : 공고번호_제목\원본파일명
#   original   : 원본파일명 그대로
attach_naming = seq_prefix

# 첨부파일 다운로드 수행 여부 (yes / no)
download_attachments = yes

# 이미 다운로드된 파일 존재 시 건너뛰기 여부 (yes / no)
skip_existing_files = yes

[crawler]
# 게시판 대상 기본값 (관세청 > 알림·소식 > 공고·공시 > 행정규칙 행정예고)
bbs_id = 1366
mi = 2897

# ----------------------------------------------------------------------
# [자동 수집 페이지 지정] - 배치 파일이나 python 명령을 '인자 없이' 실행할 때
# 아래 설정에 따라 사용자 선택 메뉴 없이 즉시 자동으로 다운로드됩니다.
#
#   1) 1페이지만 자동 수집 : start_page = 1 / end_page = 1
#   2) 1~5페이지 자동 수집 : start_page = 1 / end_page = 5
#   3) 전체 페이지 수집    : all_pages = yes
# ----------------------------------------------------------------------
start_page = 1
end_page = 1
all_pages = no

# 요청 간 대기시간(초) - 과도한 요청 방지
delay = 1.0

# HTTP 요청 타임아웃(초)
timeout = 45

# 실패 시 재시도 횟수
retries = 3

# 재시도 백오프 계수(초)
retry_backoff = 1.5

# 목록 페이지당 항목 수: 10(기본), 20, 30, 40, 50
# (50 지정 시 목록 수집 속도 약 5배)
page_size = 10

# 기본 실행 단계: all (Stage 1 목록 + Stage 2 본문/첨부파일 완전 자동)
default_stage = all

# 2단계 미수집 건 기본 제한(0 = 제한 없음, 전부 수집)
stage2_limit = 0

[logging]
# 로그 파일: logs\YYYY-MM-DD.log 형식으로 일자별 자동 분리 저장
log_dir = logs
log_level = INFO
console_output = yes
