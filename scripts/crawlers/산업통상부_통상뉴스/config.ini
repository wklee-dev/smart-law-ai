[crawler]
# Existing SQLite database. Use --init-db only to create a new test database.
db_path = D:\SQLiteDB\smart_law_ai.db
# Category-specific output directory; article-ID subdirectories are added automatically.
download_dir = C:\SQLiteDB\downloads\산업통상부\통상뉴스
# Default page range when the page prompt is left blank.
start_page = 1
end_page = 1
# Request throttling and timeout in seconds.
delay_seconds = 0.5
timeout_seconds = 30
