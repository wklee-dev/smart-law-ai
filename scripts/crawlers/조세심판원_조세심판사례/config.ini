; ============================================================================
;  Tax Tribunal decision-case collector - configuration (config.ini)
;  Version  : V1.2
;  Encoding : UTF-8
;  NOTE: Absolute paths are recommended.
; ============================================================================

[db]
; Target DB (env SMART_LAW_DB_PATH overrides this; set by the smart-law-ai weekly runner)
path = C:\SQLiteDB\smart_law_ai.db
; Prefix for new tables (keeps them apart from existing tables)
prefix = tb_tt_
; Create a backup before running
backup_before_run = true
; Backup folder
backup_dir = C:\SQLiteDB\backup
; DB lock wait timeout (seconds)
timeout = 30

[network]
; Target site - official host (certificate CN = www.tt.go.kr)
base_url = https://www.tt.go.kr
; Automatic fallback host if the primary host has a DNS/connectivity problem.
; NOTE: the bare domain tt.go.kr responds only intermittently (measured 5/8),
;       so it is used as a last resort only.
base_url_alt = https://tt.go.kr
; Request User-Agent
user_agent = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36
; Delay between requests (seconds) - protects the server, below 1.0 not recommended
delay_sec = 1.0
; Request timeout (seconds)
timeout_sec = 30
; Retry count
retry_cnt = 3
; Retry backoff (seconds) - grows with the attempt number
retry_backoff_sec = 3.0

[crawl]
; Target category code(s). Customs = 90
;   All categories : 20,12,50,11,40,90,99,96,97,98
;   NOTE: 95 (Local all) is the sum of 96+97+98, so do not combine them.
semok_list = 90
; Rows per list page (fixed at 10 on the site)
page_size = 10
; Start page
start_page = 1
; Max pages per category (0 = all)
max_pages = 0
; Skip rows already collected (by dem_no)
only_new = true
; Download attachment files (HWP/PDF) or keep metadata only
download_attach = false
; Attachment download folder
attach_dir = .\downloads
; Store raw body viewer HTML (larger DB)
save_body_html = true

[log]
; Log folder (relative paths resolve against the script folder)
dir = .\logs
; Log level (DEBUG/INFO/WARNING/ERROR)
level = INFO
